syntax = "proto3";

package storage;

option go_package = "vault/proto/storage";

service StorageService {
  rpc PutChunk(PutChunkRequest) returns (PutChunkResponse);
  rpc GetChunk(GetChunkRequest) returns (stream ChunkData);
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse);
  rpc VerifyChecksum(VerifyChecksumRequest) returns (VerifyChecksumResponse);
  // Reserved for future phases
  // rpc StreamRepair(RepairRequest) returns (stream RepairChunkData);
}

message PutChunkRequest {
  string chunk_id = 1;
  bytes data = 2;
  string checksum = 3;
  string object_key = 4;
  int64 index = 5;
}

message PutChunkResponse {
  string chunk_id = 1;
  string checksum = 2;
  int64 bytes_written = 3;
  bool success = 4;
  string error_message = 5;
}

message GetChunkRequest {
  string chunk_id = 1;
  int64 offset = 2;
  int64 length = 3;
}

message ChunkData {
  string chunk_id = 1;
  bytes data = 2;
  string checksum = 3;
}

message DeleteChunkRequest {
  string chunk_id = 1;
}

message DeleteChunkResponse {
  string chunk_id = 1;
  bool success = 2;
  string message = 3;
}

message VerifyChecksumRequest {
  string chunk_id = 1;
  string expected_checksum = 2;
}

message VerifyChecksumResponse {
  string chunk_id = 1;
  bool valid = 2;
  string actual_checksum = 3;
  string message = 4;
}
